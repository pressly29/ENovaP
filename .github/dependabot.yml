version: 2
updates:
    # npm: version-update PRs are disabled (limit 0). Security alerts and
    # Dependabot security PRs still arrive (repo Settings → Code security);
    # the "Weekly Security Review" workflow triages them each Monday and opens
    # one reviewed PR with the fixes that matter for the live site.
    - package-ecosystem: npm
      directories:
          - '/'
          - '/packages/*'
      schedule:
          interval: weekly
          day: monday
          time: '03:00'
          timezone: UTC
      open-pull-requests-limit: 0
      labels:
          - dependencies
          - security

    # GitHub Actions used by the workflows (including deploys).
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
          day: monday
          time: '03:00'
          timezone: UTC
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions
