name: Build and Deploy to Netlify

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: |
          npm ci

      - name: Bootstrap monorepo (lerna + nx)
        run: |
          # Link local packages and bootstrap without hoisting/strict mode to avoid EHOISTSTRICT failures
          npx lerna link || true
          npx lerna bootstrap --ci

      - name: Build dependent packages
        run: |
          # Build packages that @deriv/core depends on, in dependency order
          npm --prefix packages/components run build || echo "components build skipped"
          npm --prefix packages/shared run build || echo "shared build skipped"
          npm --prefix packages/stores run build || echo "stores build skipped"
          npm --prefix packages/api run build || echo "api build skipped"
          npm --prefix packages/trader run build || echo "trader build failed - continuing"
          npm --prefix packages/reports run build || echo "reports build failed - continuing"
          npm --prefix packages/bot-web-ui run build || echo "bot-web-ui build failed - continuing"

      - name: Build @deriv/core
        working-directory: ${{ github.workspace }}
        run: |
          # Build core package using its npm script
          npm --prefix packages/core run build --

      - name: Show dist folder size
        run: du -sh packages/core/dist || true

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          args: deploy --site-id ${{ secrets.NETLIFY_SITE_ID }} --dir=packages/core/dist --prod --message "Deploy from GH Actions (${GITHUB_SHA})"
