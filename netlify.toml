[build]
  # Install root deps, bootstrap monorepo (link and install package deps), then run Nx build
  command = "npm ci && npx lerna link && CI=false npx lerna bootstrap --hoist && npm run build:all"
  publish = "packages/core/dist"

[build.environment]
  NODE_VERSION = "18"
  # Keep secrets scanning enabled; omit known public envs and non-source paths.
  # Docs: https://ntl.fyi/configure-secrets-scanning
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_DERIV_APP_NAME,REACT_APP_WEBSOCKET_URL,REACT_APP_DERIV_APP_ID,REACT_APP_AFFILIATE_MEDIUM,REACT_APP_AFFILIATE_SOURCE,REACT_APP_AFFILIATE_CAMPAIGN"
  # Note: Omit token here ONLY if you intend it to be public in client bundles.
  # Otherwise migrate to server-side redirect and keep scanning for it.
  # SECRETS_SCAN_OMIT_KEYS = "${SECRETS_SCAN_OMIT_KEYS},REACT_APP_AFFILIATE_TOKEN"
  SECRETS_SCAN_OMIT_PATHS = "packages/**/dist/**,packages/**/build/**,**/*.md,**/*.ps1"
  # Unique path suffix for clients analysis dashboard (do not expose sensitive info)
  REACT_APP_ADMIN_DASH_PATH = "dash"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enforce canonical domain (redirect www to apex)
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://evpnova.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["www.evpnova.com"] }

# Security and SEO headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# Mark deploy previews and branch deploys as noindex via response header
[context.deploy-preview]
  command = "npm ci && npx lerna link && CI=false npx lerna bootstrap --hoist && npm run build:all"

  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  command = "npm ci && npx lerna link && CI=false npx lerna bootstrap --hoist && npm run build:all"

  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex, nofollow"
